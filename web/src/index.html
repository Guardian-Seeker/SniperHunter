<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Sniper Hunter by Guardian Seeker</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/x-icon" href="assets/icon.ico">
  <style>html,body,.preboot-splash,.preboot-splash *{cursor:url('/assets/cursor-default.png') 16 16,auto!important}.preboot-splash{position:fixed;inset:0;display:grid;place-items:center;background:#18191A}.preboot-emblem{position:relative;width:113px;height:113px;display:grid;place-items:center}.preboot-emblem img{width:94px;height:94px}.preboot-emblem::before{content:"";position:absolute;inset:10px;border:14px solid transparent;border-left-color:#8D021F;border-right-color:#8D021F;border-radius:50%;animation:preboot-spin 1.25s linear infinite}@keyframes preboot-spin{to{transform:rotate(360deg)}}</style>
</head>
<body>
  <app-root><div class="preboot-splash" aria-label="Loading Sniper Hunter"><div class="preboot-emblem"><img src="assets/icon.ico" alt="" /></div></div></app-root>
</body>
</html>
